<!DOCTYPE html>
<html>
<head>
 <title>My JavaScript Practice</title>
</head>
<body>
 <h1>JavaScript is Fun!</h1>

 <script>
 console.log("Hello, grade 9!");
 console.log("Thanawat Bumrungsin"); 
 let Myname = "Ming Ming The chinese";
 let myschool = "Chonradsadornumrung School";
 let favfood = "Kra pow moo sab";
 let gradelevel = 9; // integer

 console.log("Name:", Myname);
 console.log("School:", myschool);
 console.log("Favorite Food:", favfood);
 console.log("Grade Level:", gradelevel)

 let Myage = 15; // integer
 let Myheight = 2.29; // float 
 const BIRTH_YEAR = 2011; // constant 
 let isStudent = true; // boolean
 let isteacher = false; // boolean


 console.log("Age:", Myage);
 console.log("Height:", Myheight);
 console.log("Birth Year:", BIRTH_YEAR);
 console.log("Student?", isStudent);
 console.log("Teacher?", isteacher);
 
 let score = 0;
 let number1 = 20;
 let number2 = 6;
 let price = 19.99;
 let tax = 0.13;
 let total = price + (price * tax);
 
 console.log("Score:", score);
 console.log("Addition:", number1 + number2);
 console.log("Subtraction:", number1 - number2);
 console.log("Multiplication:", number1 * number2);
 console.log("Division:", number1 / number2);
 console.log("Remainder:", number1 % number2);
 console.log("Total with tax:", total);

 //Calculate subtotal

 let item1 = 10.99;
 let item2 = 5.49;
 let item3 = 7.99;
 let subtotal = item1 + item2 + item3;

 // Calculate tax

 let taxRate = 0.13;
 let taxAmount = subtotal * taxRate;
 console.log("Subtotal:", subtotal);
 console.log("Tax Amount:", taxAmount);

 // Calculate total
 
 let total_ = subtotal + taxAmount;
 console.log("Total:", total_);

 // Concatenation (joining strings)

 let firstName = "Yao Ming";
 let lastName = "The Chinese";
 let fullName = firstName + " " + lastName;
 console.log("Full Name:", fullName);

 // Template literals (easier!)
 let age = 15;
 let message = `My name is ${firstName} and I am ${age} years old`;

 console.log(message);


 </script>
